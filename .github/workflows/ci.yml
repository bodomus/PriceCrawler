name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: var
          POSTGRES_PASSWORD: myPassword
          POSTGRES_DB: varprice
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U var -d varprice"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DevExpress_License: ${{ secrets.DEVEXPRESS_LICENSE }}
      Telerik_NuGet_Username: ${{ secrets.TELERIK_NUGET_USERNAME }}
      Telerik_NuGet_Password: ${{ secrets.TELERIK_NUGET_PASSWORD }}
      ConnectionStrings__Postgres: Host=localhost;Port=55432;Database=varprice;Username=var;Password=myPassword

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate DevExpress license secret
        shell: bash
        run: |
          if [ -z "${DevExpress_License}" ]; then
            echo "Missing GitHub Actions secret DEVEXPRESS_LICENSE." >&2
            echo "Add your DevExpress .NET license key and rerun the workflow." >&2
            exit 1
          fi

      - name: Install DevExpress license file
        shell: bash
        run: |
          install -d "$HOME/.config/DevExpress"
          printf '%s' "$DevExpress_License" > "$HOME/.config/DevExpress/DevExpress_License.txt"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Validate Telerik NuGet secrets
        shell: bash
        run: |
          if [ -z "${Telerik_NuGet_Username}" ]; then
            echo "Missing GitHub Actions secret TELERIK_NUGET_USERNAME." >&2
            echo "Use your Telerik account email or 'api-key' when using a Telerik NuGet API key." >&2
            exit 1
          fi

          if [ -z "${Telerik_NuGet_Password}" ]; then
            echo "Missing GitHub Actions secret TELERIK_NUGET_PASSWORD." >&2
            echo "Use your Telerik account password or Telerik NuGet API key." >&2
            exit 1
          fi

      - name: Add Telerik NuGet feed
        shell: bash
        run: |
          dotnet nuget remove source telerik 2>/dev/null || true
          dotnet nuget add source "https://nuget.telerik.com/v3/index.json" \
            --name telerik \
            --username "${Telerik_NuGet_Username}" \
            --password "${Telerik_NuGet_Password}" \
            --store-password-in-clear-text

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 55432 -U var -d varprice; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready in time." >&2
          exit 1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore --disable-build-servers

      - name: Version Check
        run: |
          dotnet --info
          dotnet msbuild VarPrice.Application/VarPrice.Application.csproj -t:GetBuildVersion -getProperty:Version -getProperty:AssemblyVersion -getProperty:FileVersion -getProperty:AssemblyInformationalVersion
          dotnet pack VarPrice.Application/VarPrice.Application.csproj --configuration Release --no-build --output ./artifacts

      - name: Test
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=55432;Database=varprice;Username=var;Password=myPassword
        run: dotnet test --configuration Release --no-build
